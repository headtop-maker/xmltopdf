# Production compose for the shared host (ats.sine.su).
#
# The service is reachable only through the Caddy instance of the ats-crm-api
# compose project, which proxies https://ats.sine.su/xmltopdf/* here. That is why
# no host port is published: the container joins the ats-crm-api_default network
# and is addressed by its service name.
services:
  xmltopdf:
    image: xmltopdf:prod
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RESOURCE_DIR: /app/resources
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 64m
    # The host has ~2 GiB RAM shared with MongoDB, ATS, BugRadar and the OCR
    # stack. The cgroup limit keeps a heavy Chromium render inside this container
    # instead of triggering a host-wide OOM killer.
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 0.8
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - shared

networks:
  shared:
    external: true
    name: ats-crm-api_default
